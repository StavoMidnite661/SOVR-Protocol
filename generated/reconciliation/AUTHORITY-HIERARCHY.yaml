authority_hierarchy:
  version: 1.0.0
  reconciliation_id: RECON-000001
  description: >
    Explicit authority hierarchy for the SOVR Protocol repository.
    In case of conflict, higher levels override lower levels.
    Generated artifacts must derive from Level 1 source.

  levels:
    LEVEL_0:
      id: L0
      name: Constitution / Frozen Protocol Authority
      description: Immutable principles, priority ordering, emergency procedures, protocol evolution
      authoritative_sources:
        - 00_protocol-manifest.yaml
        - 01_constitution.yaml
      mutable: false
      override_policy: SUPREME

    LEVEL_1:
      id: L1
      name: Canonical Protocol YAML
      description: The versioned YAML specification corpus. This is the source of truth.
      authoritative_sources:
        - 02_domain-model.yaml
        - 03_command-catalog.yaml
        - 04_event-catalog.yaml
        - 05_state-machines.yaml
        - 08_security-capabilities.yaml
        - 09_saga-orchestration.yaml
        - 11_governance-amendments.yaml
        - 12_domain-contracts.yaml
        - 13_compiler-adr.yaml
        - acceptance-tests.yaml
        - compiler.yaml
        - hybrid-boundary.yaml
        - phase_j_protocol_closure.yaml
        - projection-engine.yaml
        - domains/*.yaml
        - protocol/*.yaml
        - compiler/*.yaml
        - governance/simulation/scenarios/*.yaml
      mutable: false
      override_policy: SUPERSEDES_ALL_GENERATED

    LEVEL_2:
      id: L2
      name: Compiler Contract / ADR
      description: Architecture decisions and compiler specification contracts
      authoritative_sources:
        - compiler.yaml
        - 13_compiler-adr.yaml
        - compiler/BUILD_MANIFEST.yaml
        - compiler/COMPILER_MANIFEST.yaml
        - compiler/ERROR_TAXONOMY.yaml
        - compiler/GENERATOR_REGISTRY.yaml
        - compiler/PASS_REGISTRY.yaml
        - compiler/SEMANTIC_COMPILER_CONTRACT.yaml
      mutable: false
      override_policy: SUPERSEDES_GENERATED

    LEVEL_3:
      id: L3
      name: Canonical IR
      description: The single canonical Intermediate Representation produced by the compiler
      authoritative_sources:
        - generated/sovr-ir.json
        - generated/compiler-manifest.yaml
      mutable: false
      override_policy: SUPERSEDES_GENERATED_ARTIFACTS

    LEVEL_4:
      id: L4
      name: Generated Registries and Generated Artifacts
      description: Deterministic compiler outputs derived from Level 1-3
      authoritative_sources:
        - generated/registries/*.json
        - generated/src/**/*.ts
        - generated/typescript/*.ts
        - generated/verification/**/*
        - generated/config/**/*
        - generated/docs/**/*
        - generated/openapi.json
        - generated/prisma/schema.prisma
      mutable: false
      override_policy: DERIVED

    LEVEL_5:
      id: L5
      name: Runtime Implementation
      description: TypeScript runtime that interprets the generated registries
      authoritative_sources:
        - packages/runtime/src/**/*.ts
      mutable: true
      override_policy: MUST_CONFORM_TO_REGISTRIES

    LEVEL_6:
      id: L6
      name: Certification Artifacts
      description: Audit reports, acceptance certificates, reproducibility proofs
      authoritative_sources:
        - generated/audit/**/*
        - certification/**/*
      mutable: false
      override_policy: DERIVED

    LEVEL_7:
      id: L7
      name: Documentation
      description: Human-readable documentation that must derive from machine-readable sources
      authoritative_sources:
        - README.md
        - docs/**/*
      mutable: true
      override_policy: MUST_DERIVE_FROM_MACHINE_READABLE

    LEVEL_8:
      id: L8
      name: Historical Reports
      description: Prior engineering reports, audit findings, and historical documentation
      authoritative_sources:
        - "PHASE*_ENGINEERING_REPORT.md"
        - "*_AUDIT_REPORT.md"
        - "*_DIRECTIVE.md"
        - "DUE_DILIGENCE/**/*"
      mutable: false
      override_policy: HISTORICAL_EVIDENCE_ONLY

  resolution_rules:
    - "If Level 1 disagrees with Level 4, Level 1 prevails and Level 4 must be regenerated"
    - "If Level 5 disagrees with Level 4, Level 5 is in violation and must be repaired"
    - "If Level 7 disagrees with Level 4, Level 7 must be updated to reflect Level 4"
    - "Level 8 may not override any other level"
    - "No manual modification of generated artifacts is permitted"

  version_model:
    protocol_version: 1.0.0
    implementation_version: 0.6.0
    description: >
      Protocol version and implementation version are deliberately independent.
      Protocol v1.0.0 is FROZEN. Implementation v0.6.0 is under active development.
      All generated artifacts derive from Protocol v1.0.0 via Compiler 0.6.0.
