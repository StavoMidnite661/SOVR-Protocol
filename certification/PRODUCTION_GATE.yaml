# ============================================================
# SOVR Protocol — Production Gate
# ============================================================
# Corrected 2026-08-01 (audit finding D7).
#
# The previous revision of this file cited 16 evidence paths that
# do not exist in this repository — including a `packages/{kernel,
# security,events,ledger}` + `apps/api` + `tests/` layout that was
# superseded by `packages/{compiler,runtime,shared}`. Two categories
# (event_integrity, authorization) were marked `green` on the
# strength of files that are absent, and cited "6 tests PASS" for a
# test file that does not exist.
#
# RULE: every path listed under `evidence:` MUST resolve in this
# repository. This is enforced by `npm run certify:production`,
# which fails the build on any unresolvable evidence path. Prose
# annotations after a path are permitted; the leading token of each
# evidence entry is treated as the path.
#
# Status vocabulary:
#   green       — implemented and covered by a resolvable artifact
#   conditional — partially implemented; gaps named explicitly
#   partial     — scaffolding exists, primary work outstanding
#   red         — claimed previously but not substantiated
# ============================================================

meta:
  schema_version: "1.1.0"
  corrected: "2026-08-01"
  correction_reason: >
    Audit finding D7 — false-green statuses backed by non-existent
    evidence files. Statuses downgraded to what the repository can
    actually substantiate; stale paths remapped onto the current
    packages/{compiler,runtime,shared} layout.
  enforcement: scripts/certify-production.mjs (evidence path validator)

