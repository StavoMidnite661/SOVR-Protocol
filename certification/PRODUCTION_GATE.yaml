    - packages/runtime/src/server/jwt.ts — RS256 asymmetric JWT verification (jose)
    - packages/runtime/src/security/jwt.ts — JWT helper used by the runtime
    - packages/runtime/src/secrets — secret resolution layer
  gaps:
    - No consolidated SECURITY_FINAL_AUDIT.md exists (previously cited, absent).
    - No independent penetration test on record.

