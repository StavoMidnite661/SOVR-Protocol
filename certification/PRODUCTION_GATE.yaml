reproducibility:
  status: green
  evidence:
    - packages/compiler/src/utils/hash.ts — R3 canonical hashing (NFC + LF)
    - .gitattributes — enforces LF so CRLF cannot re-enter the corpus
    - generated/compiler-certification.json — 39/39 input hashes match
    - generated/registries/registry.manifest.json — 11/11 registries match
  notes:
    - >-
      Verified 2026-08-01 — LF and CRLF checkouts of the same corpus produce an
      identical build hash (fa9486412578…). Platform independence is empirically
      demonstrated, not merely asserted.

