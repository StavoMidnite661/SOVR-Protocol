# ============================================================
# SOVR Financial OS — Deterministic Build Manifest (Definition)
# File: compiler/BUILD_MANIFEST.yaml
# Phase: 4.6 — Deterministic Build Manifest
# Status: ARCHITECTURE_ONLY (Rule Zero — no implementation)
# ============================================================
# This file defines the SCHEMA and REPRODUCIBILITY RULES of the
# deterministic build manifest the compiler emits at PASS-019
# (MANIFEST_GENERATION). The manifest is itself a generated
# artifact; this document specifies its contract. Two identical
# repositories shall produce byte-identical manifests.
#
# Authority: compiler.yaml, SEMANTIC_COMPILER_CONTRACT.yaml
# (determinism.build_hash, certification.deterministic_build_hash).
# On divergence, frozen specs prevail.
# ============================================================

manifest:
  schema_version: "1.0.0"
  description: >
    Generated by PASS-019. Content-addressable record of a build.
    Reproducibility is the core invariant: identical inputs + compiler
    version yield a byte-identical manifest.

# ------------------------------------------------------------
# ARTIFACT TAXONOMY
# ------------------------------------------------------------
# Canonical counts so future readers never confuse the sets. Any document
# citing artifact counts MUST use this taxonomy.
artifact_taxonomy:
  primary_generated_artifacts: 168
  primary_description: >
    The PASS-015 generator output set recorded in the manifest
    output_hashes map (registries, simulation registry, TypeScript,
    OpenAPI, Prisma, Kafka/Redis config, TLA+, VEL, topology,
    guardrails, agent sandbox, coverage). These are the artifacts whose
    SHA256 values feed build_hash.
  build_evidence_artifacts: 4
  build_evidence_list:
    - compiler-manifest.yaml
    - sovr-ir.json
    - registries/registry.manifest.json
    - compiler-certification.json
  build_evidence_description: >
    Build/compiler evidence written alongside the primary set. They are
    derived from the same compilation and are included in the two-compile
    byte comparison (172 compared artifacts), but they are not members of
    the output_hashes map.
  total_certified_output_set: 172
  note: >
    168 primary + 4 evidence = 172. The determinism verifier compares all
    172. Documents citing "168" refer to primary generated artifacts;
    documents citing "172" refer to the full certified output set. The
    compiler has NOT drifted when both numbers appear.

# ------------------------------------------------------------
# MANIFEST FIELDS
# ------------------------------------------------------------
fields:

  - field: protocol_version
    type: string
    source: 00_protocol-manifest.yaml
    example: "1.0.0"

  - field: compiler_version
    type: string
    source: compiler identity
    example: "0.1.0-arch"
    note: must be pinned; version drift changes build_hash

  - field: protocol_target_version
    type: string
    source: SEMANTIC_COMPILER_CONTRACT.target_protocol_version
    example: "1.0.1"

  - field: input_hashes
    type: map<file_path, sha256>
    source: DISCOVERY_MANIFEST + parsed bytes
    note: every input file's sha256; keys sorted lexicographically

  - field: ir_hash
    type: sha256
    source: PASS-013 IR_GENERATION
    note: content hash of canonical SOVR_IR serialization

  - field: output_hashes
    type: map<artifact_path, sha256>
    source: all generated artifacts
    note: every generated file's sha256; keys sorted lexicographically

  - field: generation_order
    type: list<generator_id>
    source: GENERATOR_REGISTRY order
    note: stable, registered order

  - field: generator_versions
    type: map<generator_id, version>
    source: GENERATOR_REGISTRY

  - field: registry_versions
    type: map<registry, version>
    source: [DOMAIN_REGISTRY, AGGREGATE_REGISTRY, METADATA_STANDARD, ACCEPTANCE_STANDARD]

  - field: build_hash
    type: sha256
    source: >
      sha256(sorted(input_hashes) + ir_hash + sorted(output_hashes)
            + compiler_version + registry_versions + generation_order)
    note: single digest summarizing the entire reproducible build

# ------------------------------------------------------------
# TIMESTAMP POLICY
# ------------------------------------------------------------
timestamp_policy:
  wall_clock_in_manifest: PROHIBITED
  wall_clock_in_outputs: PROHIBITED
  generated_at_field: omitted_or_canonical_only
  rationale: >
    Any wall-clock value would break byte-identical reproducibility.
    Provenance is captured by content hashes, not time.

  # Canonical resolution for ABI-required timestamp metadata fields
  # (IntegrityBlock.timestamp, SimulationScenarioCompiled.compiled_at,
  # SimulationRegistry.integrity.timestamp). These fields remain REQUIRED
  # per the authority ABI contracts; their values are canonical, not
  # wall-clock, so R5/R9 hold without weakening the ABI.
  canonical_generated_at:
    value: "2026-08-07T00:00:00.000Z"
    format: ISO-8601 UTC
    name: CANONICAL_COMPILATION_TIMESTAMP
    implementation: packages/compiler/src/utils/deterministic-time.ts
    semantics: >
      Canonical Compilation Timestamp (CCT). A fixed, documented
      ISO-8601 instant denoting the compilation as a canonical
      provenance point; a pure function of compiler identity, identical
      for identical inputs. It is not a wall-clock measurement of any
      particular run.
    semantics_provenance: >
      CLASSIFICATION: technically resolved; governance semantics
      ESTABLISHED BY THE 2026-08-11 DETERMINISM REMEDIATION. The
      repository previously defined no value semantics for these fields
      (CONTRACT_SEMANTICS_INVESTIGATION.md §A/H1/H2 — UNRESOLVED at the
      time). This canonical reading is the operative contract from the
      remediation forward; it is NOT a claim that canonical-value
      semantics were the historical intent. A governance amendment may
      supersede it; any supersession must preserve R5/R9.
    canonical_source: >
      The repository's pre-existing deterministic time origin
      (packages/runtime/src/simulation/deterministic.ts baseTime),
      reused so the value is traceable to an established in-repo
      canonical constant rather than an arbitrary invention.
    applies_to:
      - generated/registries/*.registry.json integrity.timestamp
      - generated/simulation/scenarios.registry.json compiled_at
      - generated/simulation/scenarios.registry.json integrity.timestamp (scenario and registry level)
    guarantees:
      - independent of host clock, timezone, environment, filesystem order, execution time, and randomness
      - identical across independent compilations of identical inputs
    integrity_hash_boundaries:
      artifact_level_rule: >
        For every authority artifact (all *.registry.json and
        scenarios.registry.json): integrity.hash = sha256(canonicalJson(
        artifact minus its own top-level integrity block)). This is the
        same rule the runtime IntegrityValidator enforces. The payload is
        deterministic because all embedded provenance values are canonical
        constants (Canonical Compilation Timestamp) or content hashes.
      scenario_level_rule: >
        For each compiled scenario inside scenarios.registry.json:
        integrity.hash = sha256(canonicalJson(canonicalScenarioPayload)),
        where the canonical scenario payload excludes generated provenance
        metadata (compiled_at, integrity block, legacy integrity_hash),
        making scenario hashes pure functions of protocol source content.

# ------------------------------------------------------------
# REPRODUCIBILITY RULES
# ------------------------------------------------------------
reproducibility_rules:
  - R1: input set is the closed discovery frontier (no hidden inputs)
  - R2: file lists are sorted before hashing
  - R3: IR serialization is canonical (sorted keys, NFC, LF)
  - R4: no randomness in any generation stage
  - R5: no wall-clock or environment-variable leakage into outputs
  - R6: generator dispatch order is the registered stable order
  - R7: output paths are deterministic functions of the IR
  - R8: build_hash incorporates compiler_version + registry_versions
  - R9: identical inputs + identical compiler version => byte-identical manifest
  - R10: environmental isolation — build does not depend on host state

# ------------------------------------------------------------
# VERIFICATION OF REPRODUCIBILITY
# ------------------------------------------------------------
verification:
  method: build twice from the same commit; diff manifests
  expected: zero differences (byte-identical)
  on_difference: FAIL_BUILD with CERT diagnostic (CERT-002 if untraceable)

