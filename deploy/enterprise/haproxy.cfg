global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    maxconn 4096
    defaults
        log     global
        mode    http
        option  httplog
        option  dontlognull
        timeout connect 5s
        timeout client  30s
        timeout server  30s
        errorfile 400 /etc/haproxy/errors/400.http
        errorfile 403 /etc/haproxy/errors/403.http
        errorfile 408 /etc/haproxy/errors/408.http
        errorfile 500 /etc/haproxy/errors/500.http
        errorfile 502 /etc/haproxy/errors/502.http
        errorfile 503 /etc/haproxy/errors/503.http
        errorfile 504 /etc/haproxy/errors/504.http

frontend http-in
    bind *:80
    bind *:443 ssl crt /etc/haproxy/ssl/sovr.pem
    http-request redirect scheme https unless { ssl_fc }

    # Rate limiting
    stick-table type ip size 100k expire 1m store http_req_rate(10s)
    http-request track-sc0 src
    http-request reject if { sc_http_req_rate(0) gt 100 }

    # Security headers
    http-response set-header X-Frame-Options DENY
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

    default_backend sovr-api

backend sovr-api
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server sovr-1 sovr-api-1:3001 check inter 10s rise 3 fall 3
    server sovr-2 sovr-api-2:3001 check inter 10s rise 3 fall 3
    server sovr-3 sovr-api-3:3001 check inter 10s rise 3 fall 3

    # Timeouts
    timeout connect 5s
    timeout client  30s
    timeout server  30s

    # Health check
    option health-check
