image:
  repository: sovr/protocol
  tag: 0.9.0
  pullPolicy: IfNotPresent

replicaCount: 3

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: sovr.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sovr-tls
      hosts:
        - sovr.example.com

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 18-alpine
  auth:
    username: sovr
    password: ${DB_PASSWORD}
    database: sovr
  primary:
    persistence:
      enabled: true
      size: 100Gi

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  auth:
    enabled: true
    password: ${REDIS_PASSWORD}

kafka:
  enabled: true
  image:
    repository: confluentinc/cp-kafka
    tag: 7.5.0
