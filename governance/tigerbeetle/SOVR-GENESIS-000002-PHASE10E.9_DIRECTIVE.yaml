# 3. Absolute Prohibitions

The agent SHALL NOT:

```
CREATE GENESIS ACCOUNTS
CREATE GENESIS TRANSFERS
DELETE ACCOUNTS
DELETE TRANSFERS
ALTER ACCOUNT IDS
ALTER TRANSFER IDS
REWRITE HISTORY
FORMAT TIGERBEETLE
RESET CLUSTER
REPAIR LEDGER
MIGRATE GENESIS DATA
CHANGE ROOT HASH
OVERRIDE LOCK CERTIFICATE
```

Any attempt is:

```
GENESIS_INTEGRITY_VIOLATION
```

