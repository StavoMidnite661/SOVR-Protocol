---

# Self-Authorization Prohibition

# The agent SHALL NOT:
# - Set authorized_by to a directive identifier
# - Set authorization.approved to true without human operator action
# - Set execution.permitted to true without separate human authorization
#
# Directive identifiers are NOT human identities.
# Examples of FORBIDDEN values for authorized_by:
#   - SOVR-GENESIS-000002-PHASE10E.2
#   - SOVR-GENESIS-000002-PHASE10E.3
#   - PHASE10E.2
#   - PHASE10E.3
#
# authorized_by must be a human identity, operator ID, or null.
