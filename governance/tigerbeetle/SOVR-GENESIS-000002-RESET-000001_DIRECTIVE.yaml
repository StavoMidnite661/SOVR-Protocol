After successful empty ledger verification, generate:

```
generated/audit/
phase10e6-reset-certification.json
```

Must contain:

```json
{
  "reset_complete": true,
  "reset_timestamp": "",
  "pre_reset_hash": "",
  "post_reset_hash": "",
  "empty_ledger_verified": true,
  "accounts_after_reset": 0,
  "transfers_after_reset": 0,
  "ready_for_phase10e7": true
}
```

---

# 6. Prohibited Actions During Reset

The agent SHALL NOT:

```
AUTOMATICALLY FORMAT CLUSTER
AUTOMATICALLY DELETE DATA
BYPASS HUMAN OPERATOR CONFIRMATION
MODIFY EXISTING LEDGER RECORDS
ALTER HISTORICAL EVIDENCE
SKIP EVIDENCE ARCHIVAL
```

---

# 7. Human Operator Responsibilities

The human operator SHALL:

1. Review Phase 10E.6 investigation findings
2. Confirm reset authorization
3. Perform cluster data formatting
4. Verify TigerBeetle restart
5. Confirm empty ledger state
6. Authorize Phase 10E.7 genesis ceremony

---

# 8. Reset Completion Criteria

Reset is COMPLETE when:

```
[1] Evidence archived
[2] TigerBeetle stopped
[3] Cluster data formatted by human operator
[4] TigerBeetle restarted
[5] Empty ledger verified (accounts=0, transfers=0)
[6] Reset certification generated
```

---

# 9. Next Phase

After reset completion:

```
RESET
   |
   v
PHASE10E.7
Clean Genesis Ceremony
```

Phase 10E.7 SHALL:

1. Verify empty ledger
2. Execute genesis with corrected deterministic ID logic
3. Verify read-back matches manifest
4. Generate final certificates
5. Freeze genesis state

---

# Final Agent Instruction

```
This directive prepares for reset.

It does NOT execute reset.

The human operator must perform the actual cluster formatting.

The agent's role is:
  - Archive evidence
  - Verify pre-reset state
  - Guide reset procedure
  - Verify post-reset state
  - Certify readiness for Phase 10E.7
```

---

END OF DIRECTIVE

