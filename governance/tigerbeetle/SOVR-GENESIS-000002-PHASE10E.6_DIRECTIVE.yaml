# 1. Mission

The purpose of Phase 10E.6 is to establish the provenance and disposition of the existing TigerBeetle state discovered during Phase 10E.5.

The objective is NOT:

* repair the ledger
* overwrite history
* recreate genesis
* delete records

The objective is:

> Determine whether the existing ledger state represents an abandoned genesis attempt, an authorized test execution, or an unknown execution event.

