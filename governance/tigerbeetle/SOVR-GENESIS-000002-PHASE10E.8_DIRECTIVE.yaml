# 4. Lock Procedure

## STEP 1 — Connect to TigerBeetle

Connect to the running cluster at `127.0.0.1:8080`.

## STEP 2 — Read All Accounts

Query all accounts in the cluster.

Verify count = 8.

## STEP 3 — Read All Transfers

Query all transfers in the cluster.

Verify count = 1.

## STEP 4 — Load Genesis Manifest

Load `GENESIS_TRANSACTION_SET.json`.

Compute manifest hash:

```
SHA256(canonical_json(GENESIS_TRANSACTION_SET.json))
```

## STEP 5 — Compute Genesis Root Hash

Compute:

```
root_hash = SHA256(
  canonical_json(sorted_accounts) +
  canonical_json(sorted_transfers) +
  manifest_hash
)
```

## STEP 6 — Generate Attestation Artifacts

Write all required artifacts to `generated/audit/`.

## STEP 7 — Lock Certificate

Write `PHASE10E.8_LOCK_CERTIFICATE.yaml` to `governance/tigerbeetle/`.

## STEP 8 — Verification

Verify that all artifacts are readable and hashes match.

