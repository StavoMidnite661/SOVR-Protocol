# 10. State Machine (NO RETRY SEMANTICS)

The ceremony follows a strict state machine:

PRE_GENESIS
    |
    v
ACCOUNT_BATCH_PENDING
    |
    v
ACCOUNTS_CREATED
    |
    v
ACCOUNT_READBACK_VERIFIED
    |
    v
TRANSFER_PENDING
    |
    v
TRANSFER_CREATED
    |
    v
TRANSFER_READBACK_VERIFIED
    |
    v
GENESIS_CERTIFIED

On interruption, state becomes UNKNOWN.

UNKNOWN must NEVER automatically become RETRY.

Instead:
UNKNOWN -> READ CURRENT LEDGER -> resume controlled ceremony OR HALT

State machine design: governance/tigerbeetle/GENESIS_EXECUTION_STATE_MACHINE.yaml

---

# 11. One-Way State Transition

The ceremony implements a one-way state transition:

EMPTY -> GENESIS_PRESENT

Never:
GENESIS_PRESENT -> EMPTY

The following operations are FORBIDDEN from the genesis ceremony:
- reset
- format
- repair
- rollback
- reinitialize

