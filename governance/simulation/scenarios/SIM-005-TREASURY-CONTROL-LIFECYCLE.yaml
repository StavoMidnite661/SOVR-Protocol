scenario_id: SIM-005-TREASURY-CONTROL-LIFECYCLE
name: Treasury Control Lifecycle
description: >
  Validates treasury transfer request creation, authorization,
  reserve allocation, execution, and settlement readiness.

actor_context:
  actor_id: sim-treasury-operator
  actor_type: system
  identity_id: sim-treasury-operator-id
  session_id: sim-treasury-session-005

lifecycle:
  initial_state: REQUESTED
  terminal_state: SETTLED

commands:
  - command_id: cmd-001
    command_name: treasury.transfer.request
    domain: treasury
    aggregate: transfer_order
    aggregate_id: sim-transfer-005
    payload:
      order_id: sim-transfer-005
      source_actor_id: sim-treasury-operator
      destination_details:
        - type: ach
          address: sim-address-005
          rail: ACH
          reference: sim-ref-005
      asset_id: vault-asset-004
      amount: '50'
      purpose: test_transfer
    capability_id: treasury.transfer.request
    scope: treasury.transfer:*
    expected_result: ACCEPTED

  - command_id: cmd-002
    command_name: treasury.transfer.authorize
    domain: treasury
    aggregate: transfer_order
    aggregate_id: sim-transfer-005
    payload:
      order_id: sim-transfer-005
    capability_id: treasury.transfer.authorize
    scope: treasury.transfer:*
    expected_result: ACCEPTED

  - command_id: cmd-003
    command_name: treasury.transfer.reserve
    domain: treasury
    aggregate: transfer_order
    aggregate_id: sim-transfer-005
    payload:
      order_id: sim-transfer-005
    capability_id: treasury.transfer.reserve
    scope: treasury.transfer:*
    expected_result: ACCEPTED

  - command_id: cmd-004
    command_name: treasury.transfer.execute
    domain: treasury
    aggregate: transfer_order
    aggregate_id: sim-transfer-005
    payload:
      order_id: sim-transfer-005
    capability_id: treasury.transfer.execute
    scope: treasury.transfer:*
    expected_result: ACCEPTED

  # REPAIR: the declared terminal state SETTLED was unreachable — the flow
  # stopped at execute and used a different order_id per command. The only
  # ratified path to SETTLED is treasury.settlement.confirm (03_command-
  # catalog), which SIM-007 already exercises with this exact shape.
  - command_id: cmd-005
    command_name: treasury.settlement.confirm
    domain: treasury
    aggregate: transfer_order
    aggregate_id: sim-transfer-005
    payload:
      order_id: sim-transfer-005
      settlement_reference: sim-ref-005
      settled_at: "2026-08-08T14:00:00Z"
      settlement_amount: '50'
    capability_id: treasury.settlement.confirm
    scope: treasury.settlement:*
    expected_result: ACCEPTED

verification:
  amount_limits: true
  actor_permissions: true
  approval_chain: true
  causation_lineage: true
  state_transitions: true
