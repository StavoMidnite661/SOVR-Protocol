scenario_id: SIM-002-TREASURY-TRANSFER-APPROVAL
name: Treasury Transfer Approval
description: >
  Tests treasury transfer workflow with capability validation,
  policy evaluation, and causation chain preservation.

actor_context:
  actor_id: sim-treasury-operator
  actor_type: human
  identity_id: sim-treasury-operator-id
  session_id: sim-treasury-session-001

lifecycle:
  initial_state: INIT
  terminal_state: REQUESTED

commands:
  - command_id: cmd-001
    command_name: treasury.transfer.request
    domain: treasury
    aggregate: transfer_order
    payload:
      source_actor_id: sim-treasury-operator
      destination_actor_id: sim-recipient
      asset_id: vault-asset-001
      amount: '25'
      purpose: 'test_transfer'
      destination_details:
        - type: ach
          address: 'sim-address'
          rail: ACH
          reference: 'sim-ref-001'
    capability_id: treasury.transfer.request
    scope: treasury.transfer:*
    expected_result: ACCEPTED

  - command_id: cmd-002
    command_name: treasury.transfer.authorize
    domain: treasury
    aggregate: transfer_order
    payload:
      order_id: 'sim-transfer-001'
      authorization_reference: 'auth-ref-001'
    capability_id: treasury.transfer.authorize
    scope: treasury.transfer:*
    expected_result: ACCEPTED

verification:
  unauthorized_transfer_rejected: true
  authorized_transfer_succeeds: true
  causation_chain_preserved: true
