scenario_id: SIM-001-VAULT-FUNDING-LIFECYCLE
name: Vault Funding Lifecycle
description: >
  Creates a vault asset and verifies the event chain.
  Tests execution gates, amount limits, and audit completeness.

actor_context:
  actor_id: sim-vault-operator
  actor_type: human
  identity_id: sim-vault-operator-id
  session_id: sim-vault-session-001

lifecycle:
  initial_state: INIT
  terminal_state: REGISTERED

commands:
  - command_id: cmd-001
    command_name: vault.asset.register
    domain: vault
    aggregate: asset
    payload:
      asset_id: vault-asset-001
      asset_type: stablecoin
      issuer_id: sim-vault-operator
      ownership_id: sim-vault-operator
      custody_provider: sovr_internal
      custody_location: sovr_internal_vault_1
      native_unit: wei
      precision: 18
      valuation_source: internal
      reserve_ratio: '1.0'
      face_value: '1000'
      quantity: '1000'
    capability_id: vault.asset.create
    scope: vault.asset:*
    expected_result: ACCEPTED

verification:
  execution_gates_trigger: true
  amount_limits_enforced: true
  event_chain_valid: true
  audit_trail_complete: true
