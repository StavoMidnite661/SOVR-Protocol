# SOVR-GENESIS-000002-PHASE10A.1 COMPILER-SIMULATION INTEGRITY HASH CHANGE MANIFEST
# Required per directive: Any runtime/compiler modification requires a change manifest first.

change_id: SOVR-GENESIS-000002-PHASE10A.1-INTEGRITY-HASH
date: 2026-08-07
phase: 10A.1
directive: SOVR-GENESIS-000002-PHASE10A-COMPILER-AUTHORITY-CORRECTION

objective: Add integrity_hash to compiled simulation scenarios so SimulationRunner can detect registry tampering.

modifications:
  - file: packages/compiler/src/generators/simulation.ts
    change: Add integrity_hash field to SimulationScenarioCompiled using SHA256 of canonicalized scenario content
  - file: packages/runtime/src/simulation/simulation-runner.ts
    change: Validate scenario integrity_hash against compiled registry before execution
  - file: packages/runtime/src/execution/kernel-executor.ts
    change: Add AuthorityRegistryIntegrityError class

rationale: |
  The adversarial validation phase requires proof that tampered compiled scenarios are rejected.
  An integrity hash generated by the compiler and verified by the runtime provides fail-closed
  protection against registry tampering.

rollback_plan: |
  Remove integrity_hash field from compiler generator and runner validation.
  Revert to previous version of simulation.ts and simulation-runner.ts.
